<!doctype html>
<!-- ===== ТИШЕ v6 · ЧАСТЬ 1 из 5: оформление ===== -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ТИШЕ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1310;--surface:#151d19;--surface-2:#1c2621;--border:rgba(255,255,255,.07);
  --text:#eef3ef;--text-2:#93a199;--text-3:#5e6a63;
  --accent:#cdeb8b;--accent-2:#a9cf6e;--ink:#142010;--accent-soft:rgba(205,235,139,.14);
  --lilac:#d9b8f2;--lilac-2:#c39fe6;--lilac-ink:#2a1838;--coral:#f2967a;
  --r-xl:24px;--r-lg:20px;--r-md:16px;--pill:999px;--gap:12px;--pad:16px;--nav-h:64px;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0f0c;color:var(--text);font-family:var(--font);overscroll-behavior:none}
body{overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;min-width:0}
input[type=date],input[type=time],input[type=datetime-local]{color-scheme:dark}
::-webkit-scrollbar{display:none}

/* корпус тянется на любой экран: телефон, планшет, компьютер */
.app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.bg-glow{position:absolute;inset:-20% -30% auto;height:75%;pointer-events:none;filter:blur(30px);
  background:radial-gradient(55% 45% at 30% 30%,rgba(64,160,110,.22),transparent 70%),
             radial-gradient(45% 35% at 85% 65%,rgba(242,150,122,.10),transparent 70%);
  animation:glow 12s ease-in-out infinite}
@keyframes glow{50%{opacity:.6}}
.embla{position:relative;height:100%;overflow:hidden}
.track{display:flex;height:100%;will-change:transform;transition:transform .38s var(--ease)}
.track.dragging{transition:none}
.slide{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}

/* страница: узкая на телефоне, шире на планшете */
.page{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);
  min-height:100%;padding:calc(var(--st) + 20px) var(--pad) calc(var(--nav-h) + 54px + var(--sb))}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.page-head .h-title{flex:1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.list{display:flex;flex-direction:column;gap:8px}

/* текст */
.h-display{font-size:29px;line-height:1.12;letter-spacing:-.02em;font-weight:300}
.h-display b{font-weight:500}
.h-title{font-size:25px;font-weight:500;letter-spacing:-.02em}
.label{font-size:13px;color:var(--text-2)}
.label-ink{font-size:13px;opacity:.62}
.num-xl{font-size:42px;font-weight:500;letter-spacing:-.03em;line-height:1}
.num-xl small{font-size:19px;color:var(--text-3);font-weight:400}
.num-l{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.num-m{font-size:23px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.dim{color:var(--text-3)}

/* карточки */
.card{display:flex;flex-direction:column;gap:10px;width:100%;padding:16px;border-radius:var(--r-xl);
  background:var(--surface);border:1px solid var(--border)}
.card--accent{background:linear-gradient(150deg,var(--accent),var(--accent-2));color:var(--ink);border:0}
.card--lilac{background:linear-gradient(150deg,var(--lilac),var(--lilac-2));color:var(--lilac-ink);border:0}
.card--glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.anim .enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}}

/* чипы и кнопки */
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--pill);
  background:var(--surface-2);font-size:13px;white-space:nowrap;transition:background .25s,color .25s}
.chip--dark{background:rgba(0,0,0,.14)}
.chip.is-active{background:var(--accent);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);
  color:var(--text-2);flex:0 0 auto;transition:transform .18s var(--spring)}
.icon-btn:active{transform:scale(.88)}
.icon-btn[disabled]{opacity:.28}
.icon-btn--accent{background:var(--accent);color:var(--ink)}
.btn{height:50px;padding:0 20px;border-radius:var(--pill);background:var(--surface-2);font-weight:500;
  text-align:center;display:grid;place-items:center;transition:transform .18s var(--spring)}
.btn:active{transform:scale(.96)}
.btn--accent{background:var(--accent);color:var(--ink)}
.btn--danger{background:var(--coral);color:#2a1108}
.btn--block{width:100%}
.field{display:flex;align-items:center;gap:8px;min-height:50px;padding:5px 5px 5px 16px;border-radius:var(--pill);
  background:var(--surface-2);border:1px solid var(--border);transition:border-color .2s}
.field:focus-within{border-color:rgba(205,235,139,.4)}
.field input{flex:1;height:40px;font-size:15px}
.input{width:100%;min-height:50px;padding:13px 16px;border-radius:var(--r-md);background:var(--surface-2);
  border:1px solid var(--border);font-size:15px;transition:border-color .2s}
.input:focus{border-color:rgba(205,235,139,.4)}
textarea.input{min-height:88px;resize:none}
input::placeholder,textarea::placeholder{color:var(--text-3)}
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);
  color:var(--ink);flex:0 0 auto;transition:transform .18s var(--spring)}
.send:active{transform:scale(.86)}

/* переключатель периодов */
.seg{display:flex;padding:4px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--border)}
.seg button{flex:1;height:38px;border-radius:var(--pill);font-size:13.5px;color:var(--text-2);text-align:center;
  transition:background .28s var(--ease),color .28s var(--ease)}
.seg button.is-active{background:var(--accent);color:var(--ink);font-weight:500}

/* полоски */
.bar{position:relative;height:11px;border-radius:var(--pill);background:rgba(255,255,255,.07);overflow:hidden}
.bar--thin{height:6px}
.bar__fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:var(--pill);
  background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .8s var(--ease),background .5s}
.bar__fill::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 2.6s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(200%)}}
.bar.is-over .bar__fill{background:linear-gradient(90deg,#e07f60,var(--coral))}
.bar.is-over{animation:over 2s ease-in-out infinite}
@keyframes over{50%{box-shadow:0 0 0 4px rgba(242,150,122,.15)}}
.bar-hint{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-2)}

/* главная */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.home-head .label{text-transform:capitalize;margin-bottom:6px}
.home-main{display:flex;flex-direction:column;gap:var(--gap)}
.task-card{min-height:148px;justify-content:space-between}
.task-card__title{font-size:16px;font-weight:500;line-height:1.28;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note-card__text{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quick-row{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px}
.quick-chip{flex:0 0 auto;height:36px;padding:0 13px;border-radius:var(--pill);background:var(--surface-2);
  border:1px solid var(--border);font-size:12.5px;display:flex;align-items:center;gap:6px;transition:transform .18s var(--spring)}
.quick-chip:active{transform:scale(.92)}

/* ═══ КЛАВИШИ ПРОВЕРОК ═══ */
.ck-card{gap:12px;padding:16px 14px 14px;border-radius:var(--r-xl);
  background:linear-gradient(168deg,#19241e,#111815);border:1px solid rgba(205,235,139,.13)}
.ck-card.celebrate{animation:celebrate 1.4s var(--ease)}
@keyframes celebrate{0%{box-shadow:0 0 0 0 rgba(205,235,139,.5)}100%{box-shadow:0 0 0 26px rgba(205,235,139,0)}}
.ck-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ck-top .num-xl{margin-top:4px}
.ck-streak{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:var(--pill);
  background:var(--accent-soft);color:var(--accent);font-size:12px;white-space:nowrap;font-weight:500}

.ck-grid{display:grid;gap:9px;container-type:inline-size}
.ck{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;aspect-ratio:var(--ar,1);padding:6px;border-radius:18px;
  background:rgba(255,255,255,.035);border:1.5px solid rgba(255,255,255,.06);color:var(--text-3);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;text-align:center;
  transition:background .35s var(--ease),border-color .35s var(--ease),transform .18s var(--spring),box-shadow .35s}
.ck:active{transform:scale(.94)}
.ck__ico{display:grid;place-items:center;opacity:.32;
  transition:opacity .4s,color .4s,filter .4s;animation:hop 4.2s var(--ease) infinite;animation-delay:var(--d,0s)}
.ck__ico svg{width:var(--isz,32px);height:var(--isz,32px)}
.ck__name{font-size:var(--nf,12px);line-height:1.1;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text-2);max-width:100%;padding:0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .35s}
.ck__time{font-size:10px;line-height:1;height:10px;color:var(--accent);opacity:.8;letter-spacing:.02em}
.ck.is-done{background:radial-gradient(130% 95% at 50% 25%,rgba(205,235,139,.22),rgba(205,235,139,.03) 72%);
  border-color:rgba(205,235,139,.42);box-shadow:0 0 24px rgba(205,235,139,.09)}
.ck.is-done .ck__ico{opacity:1;color:var(--accent);filter:drop-shadow(0 0 7px rgba(205,235,139,.6));
  animation:lit .55s var(--spring)}
.ck.is-done .ck__name{color:var(--text)}
.ck.holding::before{content:'';position:absolute;inset:0;background:rgba(242,150,122,.32);
  transform-origin:bottom;animation:holdfill .62s linear forwards}
.ck.pop{animation:ckpop .5s var(--spring)}
.ck.pop::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;
  background:rgba(205,235,139,.45);animation:ripple .6s var(--ease) forwards;pointer-events:none}
.ck.wiggle{animation:wiggle .42s var(--ease)}
.ck__proof{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;z-index:2;
  background:rgba(0,0,0,.35) center/cover no-repeat;border:1px solid rgba(255,255,255,.15)}
@keyframes hop{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-4px)}86%{transform:translateY(0)}92%{transform:translateY(-2px)}}
@keyframes lit{0%{transform:scale(.72)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes holdfill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ckpop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes ripple{to{transform:scale(16);opacity:0}}
@keyframes wiggle{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* пусто — плюс */
.ck-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:130px;border-radius:18px;border:1.5px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.02);
  color:var(--text-3);font-size:13.5px;padding:18px;text-align:center;
  transition:transform .18s var(--spring),border-color .25s,color .25s}
.ck-empty:active{transform:scale(.97)}
.ck-empty__plus{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:var(--ink);box-shadow:0 0 0 6px rgba(205,235,139,.09)}

/* экран проверок */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero__c{padding:13px 11px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border)}
.hero__n{font-size:23px;font-weight:500;letter-spacing:-.02em}
.hero__n small{font-size:13px;color:var(--text-3);font-weight:400}
.hero__l{font-size:11px;color:var(--text-2);margin-top:2px;line-height:1.25}
.hint{font-size:12px;color:var(--text-3);text-align:center;line-height:1.45}
.hist-scroll{display:flex;gap:7px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px}
.hist-day{flex:0 0 50px;padding:9px 3px;border-radius:13px;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;gap:5px;border:1.5px solid transparent;text-align:center;transition:border-color .2s}
.hist-day.is-sel{border-color:var(--accent)}
.hist-day__t{font-size:10px;color:var(--text-3);line-height:1.2}
.hist-ring{--p:0;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%),rgba(255,255,255,.08) 0)}
.hist-ring span{width:21px;height:21px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:10px;color:var(--text-2)}
.hist-day.full .hist-ring span{color:var(--accent)}
.matrix{display:flex;flex-direction:column;gap:8px}
.matrix__row{display:flex;align-items:center;gap:10px}
.matrix__name{flex:0 0 32%;font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.matrix__pips{flex:1;display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.pip{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.07)}
.pip.on{background:var(--accent)}
.thumb{width:42px;height:42px;border-radius:11px;background:var(--surface-2) center/cover no-repeat;flex:0 0 auto}
.photo-big{width:100%;border-radius:16px;display:block}

/* строки */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);width:100%;
  background:var(--surface);border:1px solid var(--border)}
.row__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row__title{font-size:15px}
.row__meta{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.row.is-overdue .row__meta{color:var(--coral)}
.row.is-done .row__title{color:var(--text-3);text-decoration:line-through}
.row__ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);flex:0 0 auto}
.tick{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--text-3);
  color:transparent;flex:0 0 auto;transition:all .22s}
.tick.is-on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.tick--ink{border-color:rgba(20,32,16,.35);color:var(--ink);width:40px;height:40px}
.tick:active{transform:scale(.88)}
.empty{padding:38px 20px;text-align:center;color:var(--text-3);font-size:15px;line-height:1.45;white-space:pre-line}

/* график и категории */
.chart{display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:8px}
.chart--dense{gap:3px}
.chart__col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.chart__bar{width:100%;max-width:24px;min-height:4px;border-radius:8px;background:var(--surface-2);height:0;transition:height .7s var(--ease)}
.chart__bar.is-today{background:var(--accent)}
.chart__lbl{font-size:10px;color:var(--text-3);height:12px;white-space:nowrap}
.cat{display:flex;flex-direction:column;gap:6px}
.cat__top{display:flex;justify-content:space-between;font-size:14px}
.day-nav{display:flex;align-items:center;gap:8px;padding:5px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--border)}
.day-nav__lbl{flex:1;text-align:center;font-size:13.5px;font-weight:500;text-transform:capitalize;line-height:1.2}

/* нижняя панель */
.nav{position:absolute;left:0;right:0;bottom:calc(14px + var(--sb));z-index:20;display:flex;justify-content:center;pointer-events:none}
.nav__pill{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:8px;height:var(--nav-h);border-radius:var(--pill);
  background:rgba(22,30,26,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.nav__item{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--surface-2);
  transition:background .26s,color .26s,transform .2s var(--spring)}
.nav__item:active{transform:scale(.88)}
.nav__item.is-active{background:var(--accent);color:var(--ink)}
.nav__gap{width:76px}
.nav__record{pointer-events:auto;position:absolute;left:50%;bottom:0;transform:translateX(-50%);border-radius:50%;transition:transform .2s var(--spring)}
.nav__record:active{transform:translateX(-50%) scale(.9)}

/* логотип */
.logo-btn{--s:72px;width:var(--s);height:var(--s);border-radius:50%;position:relative;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(150deg,#22302a,#131b17);border:1px solid rgba(205,235,139,.3)}
.logo-btn::before{content:'';position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(#cdeb8b,#7fd8c4,#9db6f6,#d9b8f2,#f4bccd,#f2967a,#f6d58a,#cdeb8b);
  opacity:.25;filter:blur(8px);animation:spin 9s linear infinite}
.logo-btn__mark{position:relative;z-index:1;color:var(--accent);display:grid;place-items:center}
.logo-btn.is-live::before{opacity:.7;animation-duration:1.6s}
.logo-btn.is-live .logo-btn__mark{animation:wave 1.3s var(--ease) infinite}
.logo-btn.is-type .logo-btn__mark{animation:typing .45s ease-in-out infinite alternate}
.logo-btn.draw .logo-mark path{stroke-dasharray:46;stroke-dashoffset:46;animation:draw .9s var(--ease) forwards}
.logo-btn.draw .logo-mark path:nth-child(2){animation-delay:.15s}
.logo-btn.draw .logo-mark path:nth-child(3){animation-delay:.3s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wave{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-7deg)}65%{transform:scale(1.05) rotate(6deg)}}
@keyframes typing{to{transform:translateY(-3px) rotate(-5deg)}}
@keyframes spin{to{transform:rotate(1turn)}}

/* шторка */
.sheet-bd{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);animation:fade .22s ease}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:31;max-height:92%;
  overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding:12px 18px calc(22px + var(--sb));
  border-radius:30px 30px 0 0;border-top:1px solid var(--border);
  background:linear-gradient(180deg,#17211c,#0f1613);animation:up .4s var(--ease)}
.sheet__title{font-size:19px;font-weight:500}
.sheet__center{display:flex;flex-direction:column;align-items:center;gap:13px;padding:12px 0 4px}
.sheet__status{font-size:14.5px;color:var(--text-2);text-align:center;min-height:20px}
.sheet__hint{font-size:12px;color:var(--coral);text-align:center;max-width:300px;line-height:1.4}
.form-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:4px}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes fade{from{opacity:0}}

/* окно подтверждения */
.modal-bd{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:24px;animation:fade .2s ease}
.modal{width:100%;max-width:330px;border-radius:24px;padding:20px;background:#1b2521;border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop-in .32s var(--spring);display:flex;flex-direction:column;gap:13px}
@keyframes pop-in{from{opacity:0;transform:scale(.92)}}
.modal__title{font-size:17px;font-weight:500;line-height:1.3}
.modal__text{font-size:13.5px;color:var(--text-2);line-height:1.45}
.modal__actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* подстраницы */
.subpage{position:absolute;inset:0;z-index:25;background:var(--bg);overflow-y:auto;animation:slide-in .34s var(--ease)}
.subpage .page{padding-bottom:calc(36px + var(--sb))}
@keyframes slide-in{from{transform:translateX(28px);opacity:0}}

/* уведомление */
.toast{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:520px;z-index:60;
  bottom:calc(var(--nav-h) + 34px + var(--sb));display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-radius:var(--r-lg);background:#26322c;border:1px solid var(--border);
  box-shadow:0 12px 40px rgba(0,0,0,.45);animation:toast-in .34s var(--spring);font-size:13.5px;line-height:1.35}
.toast button{color:var(--accent);font-weight:500;flex:0 0 auto}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}

/* выбор иконки */
.icon-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icon-picker button{aspect-ratio:1;border-radius:14px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;
  transition:transform .18s var(--spring),box-shadow .2s,color .2s}
.icon-picker button:active{transform:scale(.88)}
.icon-picker button.is-active{box-shadow:0 0 0 2px var(--accent);color:var(--accent);background:rgba(205,235,139,.09)}
.switch{position:relative;width:48px;height:28px;border-radius:var(--pill);background:var(--surface-2);flex:0 0 auto;transition:background .26s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text-3);
  transition:transform .26s var(--spring),background .26s}
.switch.is-on{background:rgba(205,235,139,.2)}
.switch.is-on::after{transform:translateX(20px);background:var(--accent)}

/* дыхание */
.breath{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0 4px}
.breath__circle{width:186px;height:186px;border-radius:50%;display:grid;place-items:center;transform:scale(.62);
  background:radial-gradient(circle,rgba(205,235,139,.26),rgba(205,235,139,.03) 70%);border:1px solid rgba(205,235,139,.3);
  transition-property:transform;transition-timing-function:ease-in-out}
.breath__txt{font-size:21px;font-weight:300;min-height:26px}

/* ═══ АДАПТИВ ═══ */
@media(min-width:600px){
  .page{max-width:720px;padding-left:22px;padding-right:22px}
  .h-display{font-size:32px}
  .num-xl{font-size:46px}
  .quick-row{margin-left:-22px;margin-right:-22px;padding-left:22px;padding-right:22px}
  .hist-scroll{margin-left:-22px;margin-right:-22px;padding-left:22px;padding-right:22px}
  .ck-grid{gap:11px}
  .sheet{max-width:720px}
}
@media(min-width:1000px){
  .page{max-width:1000px;padding-left:28px;padding-right:28px}
  .home-main{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .home-main>.ck-card{grid-column:1/-1}
  .home-main>.spend-card{grid-column:1/-1}
  .home-main>.grid-2{display:contents}
  .h-display{font-size:36px}
  .num-xl{font-size:52px}

  .hist-scroll{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .sheet{max-width:1000px}
  .ck-grid{gap:13px}
}
@media(min-width:1400px){
  .page{max-width:1160px}
}

/* ---------- разбор фраз ---------- */
const EXPENSE_VERB = /(потратил[аи]?|купил[аи]?|заплатил[аи]?|оплатил[аи]?|минус)/i;

  const after = text.slice(m.index + m[0].length).replace(/^\s*(на|за)\s+/i, '').trim();
  const before = text.slice(0, m.index).replace(EXPENSE_VERB, '').replace(/\s*(на|за)\s*$/i, '').trim();

  if (t && +t[1] <= 23) {

function ckLayout(n) {
  if (n === 1) return { cols: 1, ar: 2.0 };
  if (n === 2) return { cols: 2, ar: 1.15 };
  if (n === 3) return { cols: 3, ar: 1 };
  if (n === 4) return { cols: 2, ar: 1.1 };
  if (n <= 6) return { cols: 3, ar: 0.95 };
  if (n <= 8) return { cols: 4, ar: 0.95 };
  if (n === 9) return { cols: 3, ar: 0.85 };
  if (n <= 12) return { cols: 4, ar: 0.85 };
  return { cols: 5, ar: 0.85 };
}

function ckMetrics(cols, big) {
  const base = cols === 1 ? 64 : cols === 2 ? 52 : cols === 3 ? 42 : cols === 4 ? 32 : 26;
  const nf = cols === 1 ? 16 : cols === 2 ? 14 : cols === 3 ? 12.5 : cols === 4 ? 11 : 10;
  const k = big ? 1.22 : 1;
  return {
    isz: Math.round(base * k),
    nf: Math.round(nf * (big ? 1.1 : 1) * 10) / 10,
  };
}

function ckCell(c, i, span, ar, isz, nf) {
  const at = checkAt(c.id);

  return `<button class="ck ${at ? 'is-done' : ''}" data-ck="${c.id}" aria-label="${esc(c.title)}"

function ckGrid(big) {
  const n = DB.checks.length;

    return `<button class="ck-empty" data-act="open-sub" data-sub="checks-set">
      <span class="ck-empty__plus">${icon('plus', 26)}</span>

  }
  const lay = ckLayout(n);
  const cols = lay.cols;
  const arUse = big ? lay.ar * 0.88 : lay.ar;
  const m = ckMetrics(cols, big);
  const rem = n % cols;
  const units = rem ? cols * rem : cols;
  const spanN = units / cols;
  const spanL = rem ? units / rem : units;
  const arL = arUse * (spanN / spanL);
  const lastFrom = n - rem;

  return `<div class="ck-grid" style="grid-template-columns:repeat(${units},1fr)">
    ${DB.checks.map((c, i) => {

}

/* ===== ТИШЕ v6 · ЧАСТЬ 5 из 5: события и запуск ===== */

let press = null;
let suppress = false;
let breathTimer = null;
let proofFor = null;
let newCheckTitle = '';

/* ---------- переключение экранов ---------- */
function setTrack(i, dragging) {
  const tr = $('#track');
  if (!tr) return;
  if (dragging) tr.classList.add('dragging');
  tr.style.transform = `translateX(${-i * 100}%)`;
  if (dragging) requestAnimationFrame(() => requestAnimationFrame(() => tr.classList.remove('dragging')));
}

function goTab(i) {
  i = Math.max(0, Math.min(3, i));
  if (i === tab) { pick(); return; }
  tab = i;
  pick();
  renderNav();
  setTrack(tab, false);
}

function showSub(name) {
  if (!name || !SUBS[name]) return;
  if (subs[subs.length - 1] === name) return;
  subs.push(name);
  renderSubs();
}

/* ---------- отрисовка ---------- */
function renderNav() {
  const tabs = [['home', 'Главная'], ['tasks', 'Задачи'], ['wallet', 'Траты'], ['shield', 'Проверки']];
  const it = (i) => `<button class="nav__item ${tab === i ? 'is-active' : ''}" data-act="go" data-tab="${i}" aria-label="${tabs[i][1]}">${icon(tabs[i][0])}</button>`;
  const nav = $('#nav');
  nav.innerHTML = `<div class="nav__pill">${it(0)}${it(1)}<span class="nav__gap"></span>${it(2)}${it(3)}</div>
    <button class="nav__record" data-act="voice" aria-label="Добавить">${logoBtn(72)}</button>`;
  nav.style.display = subs.length ? 'none' : '';
}

function renderSubs() {
  const name = subs[subs.length - 1];
  $('#sub').innerHTML = name ? `<div class="subpage">${SUBS[name]()}</div>` : '';
  const nav = $('#nav');
  if (nav) nav.style.display = name ? 'none' : '';
  const inp = $('#newCheck');
  if (inp) inp.value = newCheckTitle;
}

function renderSheet() {
  $('#sheetBox').innerHTML = sheet
    ? `<div class="sheet-bd" data-act="close-sheet"></div><div class="sheet">${sheetHtml()}</div>`
    : '';
}

function renderModal() {
  const box = $('#modalBox');
  if (!modal) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="modal-bd"><div class="modal">
    <div class="modal__title">${esc(modal.title)}</div>
    <div class="modal__text">${esc(modal.text || '')}</div>
    <div class="modal__actions">
      <button class="btn" data-act="modal-no">Отмена</button>
      <button class="btn ${modal.danger ? 'btn--danger' : 'btn--accent'}" data-act="modal-yes">${esc(modal.ok || 'Да')}</button>
    </div></div></div>`;
}

function renderToast() {
  $('#toastBox').innerHTML = toast
    ? `<div class="toast"><span>${esc(toast.text)}</span>${toast.undo ? '<button data-act="undo">Отменить</button>' : ''}</div>`
    : '';
}

function animateBars() {
  requestAnimationFrame(() => {
    $$('[data-fill]').forEach((el) => { el.style.width = (parseFloat(el.dataset.fill) || 0) + '%'; });
    $$('[data-h]').forEach((el, i) => {
      setTimeout(() => { el.style.height = el.dataset.h + '%'; }, 60 + i * 12);
    });
  });
}

function render() {
  const track = $('#track');
  $$('.slide', track).forEach((s, i) => { scrollMem[i] = s.scrollTop; });
  const pages = [pageHome, pageTasks, pageExpenses, pageChecks];
  track.innerHTML = pages.map((fn, i) => `<section class="slide" data-slide="${i}">${fn()}</section>`).join('');
  renderNav();
  renderSubs();
  renderSheet();
  renderModal();
  renderToast();
  animateBars();
  setTrack(tab, true);
  requestAnimationFrame(() => {
    $$('.slide', track).forEach((s, i) => { if (scrollMem[i]) s.scrollTop = scrollMem[i]; });
  });
}

/* ---------- клавиши: одна правка — видны везде ---------- */
function paintCheck(id) {
  const c = DB.checks.find((x) => x.id === id);
  if (!c) return;
  const at = checkAt(id);
  const pr = (DB.proofs[dayKey()] || {})[id];

  $$('.ck[data-ck="' + id + '"]').forEach((el) => {
    el.classList.toggle('is-done', !!at);

    const tm = el.querySelector('.ck__time');
    if (tm) tm.textContent = at ? hhmm(at) : '';

    const slot = el.querySelector('.ck__ico');
    if (slot) {
      const sv = slot.querySelector('svg');
      const sz = sv ? (+sv.getAttribute('width') || 26) : 26;
      slot.innerHTML = cicon(c.icon, sz);
    }

    let badge = el.querySelector('.ck__proof');
    if (pr) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'ck__proof';
        el.appendChild(badge);
      }
      badge.style.backgroundImage = `url('${pr}')`;
    } else if (badge) {
      badge.remove();
    }
  });
}

function syncChecks() {
  const s = ckSummary();
  $$('[data-ck-count]').forEach((el) => { el.innerHTML = `${s.d}<small>/${s.n}</small>`; });
  $$('[data-ck-streak]').forEach((el) => { el.textContent = streakLabel(s.s); });
  $$('[data-ck-streakn]').forEach((el) => { el.textContent = s.s; });
  $$('[data-ck-left]').forEach((el) => {
    el.textContent = s.n - s.d;
    el.style.color = s.n - s.d ? 'var(--coral)' : 'var(--accent)';
  });
  $$('[data-ck-hint]').forEach((el) => { el.textContent = ckHint(s.d, s.n); });
  $$('[data-bar="ck-home"], [data-bar="ck-page"]').forEach((el) => { el.style.width = s.pct + '%'; });
}

function refreshHistory() {
  const box = $('#histBox');
  if (box) box.innerHTML = histHtml();
}

function ckTap(el) {
  const id = el.dataset.ck;
  const c = DB.checks.find((x) => x.id === id);
  if (!c) return;
  const k = dayKey();
  DB.log[k] = DB.log[k] || {};

  if (DB.log[k][id]) { openSheet({ type: 'ck', id }); return; }

  DB.log[k][id] = new Date().toISOString();
  save();

  paintCheck(id);
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 520);
  syncChecks();
  refreshHistory();

  const d = doneCount(k);
  const n = DB.checks.length;
  if (n && d >= n) {
    const st = streak();
    $$('.ck-card').forEach((card) => {
      card.classList.add('celebrate');
      setTimeout(() => card.classList.remove('celebrate'), 1500);
    });
    ok();
    setTimeout(() => {
      showToast(`Все ${n} ${plural(n, 'проверка', 'проверки', 'проверок')} закрыты · ${st} ${plural(st, 'день', 'дня', 'дней')} подряд`);
    }, 280);
  } else {
    tap();
  }
}

/* ---------- удержание = снять ---------- */
function pressStart(e) {
  if (subs.length || sheet || modal) return;
  const el = e.target.closest && e.target.closest('[data-ck]');
  if (!el) return;
  const id = el.dataset.ck;
  const at = (DB.log[dayKey()] || {})[id];
  if (!at) return;

  press = { id, el, long: false, t1: null, t2: null };

  press.t1 = setTimeout(() => {
    if (press && press.el) press.el.classList.add('holding');
  }, 150);

  press.t2 = setTimeout(() => {
    if (!press) return;
    press.long = true;
    clearTimeout(press.t1);
    press.el.classList.remove('holding');
    const cc = DB.checks.find((x) => x.id === id);
    const shot = at;
    warn();
    showModal({
      title: 'Снять отметку?',
      text: `«${cc.title}» отмечено в ${hhmm(shot)}. Если всё в порядке — оставь как есть.`,
      ok: 'Снять',
      danger: true,
      onOk: () => {
        delete DB.log[dayKey()][id];
        save();
        closeModal();
        paintCheck(id);
        syncChecks();
        refreshHistory();
        showToast('Отметка снята', () => {
          todayLog()[id] = shot;
          save();
          paintCheck(id);
          syncChecks();
          refreshHistory();
        });
      },
    });
  }, 640);
}

function pressEnd() {
  if (!press) return;
  clearTimeout(press.t1);
  clearTimeout(press.t2);
  if (press.el) press.el.classList.remove('holding');
  if (press.long) { suppress = true; setTimeout(() => { suppress = false; }, 500); }
  press = null;
}

/* ---------- свайпы ---------- */
let drag = null;
function swipeStart(e) {
  if (subs.length || sheet || modal) return;
  if (e.target.closest && e.target.closest('input,textarea,[data-noswipe]')) return;
  const t = e.touches ? e.touches[0] : e;
  drag = { x: t.clientX, y: t.clientY, dx: 0, lock: false, on: true };
}
function swipeMove(e) {
  if (!drag || !drag.on) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - drag.x;
  const dy = t.clientY - drag.y;
  if (!drag.lock) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) < Math.abs(dy) * 1.3) { drag.on = false; return; }
    drag.lock = true;
    $('#track').classList.add('dragging');
  }
  const w = $('#embla').clientWidth || 1;
  const edge = (tab === 0 && dx > 0) || (tab === 3 && dx < 0);
  const shift = -tab * 100 + (dx / w) * 100 * (edge ? 0.25 : 1);
  $('#track').style.transform = `translateX(${shift}%)`;
  drag.dx = dx;
}
function swipeEnd() {
  if (!drag) return;
  const d = drag;
  drag = null;
  const tr = $('#track');
  tr.classList.remove('dragging');
  const w = $('#embla').clientWidth || 1;
  if (d.lock && Math.abs(d.dx) > w * 0.18) {
    const next = Math.max(0, Math.min(3, tab + (d.dx < 0 ? 1 : -1)));
    if (next !== tab) {
      tab = next;
      pick();
      renderNav();
      setTrack(tab, false);
      return;
    }
  }
  setTrack(tab, false);
}

/* ---------- шторки ---------- */
function openSheet(s) {
  sheet = s;
  tap();
  renderSheet();
  if (s.type === 'breath') startBreath();
}
function closeSheet() {
  sheet = null;
  if (breathTimer) { clearTimeout(breathTimer); breathTimer = null; }
  renderSheet();
}
function openVoice() {
  openSheet({ type: 'voice', text: '', hint: '' });
  setTimeout(() => { const i = $('#sheetInput'); if (i) i.focus(); }, 320);
}
function openExpense() {
  openSheet({ type: 'expense', amount: '', note: '', cat: '', date: dayKey() });
}
function toConfirm(text) {
  const t = String(text || '').trim();
  if (!t) return;
  sheet = { type: 'confirm', draft: parseLocal(t), source: t, text: t };
  renderSheet();
}

function collectSheet() {
  if (!sheet) return;
  if (sheet.type === 'expense') {
    const a = $('#eAmount'), n = $('#eNote'), d = $('#eDate');
    if (a) sheet.amount = a.value;
    if (n) sheet.note = n.value;
    if (d && d.value) sheet.date = d.value;
    return;
  }
  if (sheet.type === 'confirm' && sheet.draft) {
    const d = sheet.draft;
    if (d.kind === 'task') {
      const t = $('#fTitle'), du = $('#fDue');
      if (t) d.title = t.value;
      if (du) d.dueAt = du.value ? new Date(du.value).toISOString() : null;
    } else if (d.kind === 'expense') {
      const am = $('#fAmount'), nt = $('#fNote');
      if (am) d.amount = Math.round((parseFloat(String(am.value).replace(',', '.')) || 0) * 100);
      if (nt) d.note = nt.value;
    } else if (d.kind === 'note') {
      const tx = $('#fText');
      if (tx) d.text = tx.value;
    }
  }
}

function saveDraft() {
  collectSheet();
  const d = sheet && sheet.draft;
  if (!d) return;
  if (d.kind === 'task' && !String(d.title || '').trim()) { showToast('Напиши, что сделать'); return; }
  if (d.kind === 'expense' && !d.amount) { showToast('Не указана сумма'); return; }
  if (d.kind === 'note' && !String(d.text || '').trim()) { showToast('Заметка пустая'); return; }
  const kind = d.kind;
  const undo = commit(d);
  ok();
  closeSheet();
  render();
  showToast(SAVED[kind], undo);
}

function saveExpense() {
  collectSheet();
  const amount = Math.round((parseFloat(String(sheet.amount || '').replace(',', '.')) || 0) * 100);
  if (!amount) { showToast('Введи сумму'); return; }
  const note = String(sheet.note || '').trim();
  const cat = sheet.cat || guessCat(note);
  const base = sheet.date ? new Date(sheet.date + 'T12:00:00') : new Date();
  const now = new Date();
  base.setHours(now.getHours(), now.getMinutes(), 0, 0);
  const id = uid();
  DB.expenses.unshift({ id, amount, category: cat, note, spentAt: base.toISOString() });
  save();
  ok();
  closeSheet();
  render();
  showToast('Трата записана', () => { DB.expenses = DB.expenses.filter((e) => e.id !== id); save(); render(); });
}

function quickAdd(note, rubles) {
  const amount = Math.round(rubles * 100);
  if (!amount) return;
  const id = uid();
  DB.expenses.unshift({ id, amount, category: guessCat(note), note, spentAt: new Date().toISOString() });
  save();
  ok();
  render();
  showToast(`${note} · ${money(amount)}`, () => {
    DB.expenses = DB.expenses.filter((e) => e.id !== id);
    save();
    render();
  });
}

function delExpense(id) {
  const i = DB.expenses.findIndex((x) => x.id === id);
  if (i < 0) return;
  const backup = DB.expenses.splice(i, 1)[0];
  save();
  tap();
  render();
  showToast('Трата удалена', () => { DB.expenses.splice(i, 0, backup); save(); render(); });
}

function stepDay(d) {
  const a = fromKey(expenseDay);
  if (period === 'month') { a.setDate(1); a.setMonth(a.getMonth() + d); }
  else if (period === 'week') { a.setDate(a.getDate() + d * 7); }
  else { a.setDate(a.getDate() + d); }
  if (+startOfDay(a) > +startOfDay()) return;
  expenseDay = dayKey(a);
  pick();
  render();
}

/* ---------- задачи и заметки ---------- */
function toggleTask(id) {
  const t = DB.tasks.find((x) => x.id === id);
  if (!t) return;
  t.done = !t.done;
  save();
  t.done ? ok() : tap();
  render();
}
function delTask(id) {
  const i = DB.tasks.findIndex((x) => x.id === id);
  if (i < 0) return;
  const backup = DB.tasks.splice(i, 1)[0];
  save();
  tap();
  render();
  showToast('Задача удалена', () => { DB.tasks.splice(i, 0, backup); save(); render(); });
}
function delNote(id) {
  DB.notes = DB.notes.filter((n) => n.id !== id);
  save();
  tap();
  render();
}

/* ---------- кнопки проверки ---------- */
function addCheck() {
  const title = String(newCheckTitle || '').trim();
  if (!title) { showToast('Придумай название'); return; }
  if (DB.checks.length >= 30) { showToast('Больше 30 не нужно'); return; }
  DB.checks.push({ id: uid(), title, icon: pickedIcon });
  newCheckTitle = '';
  save();
  ok();
  render();
  showToast('Кнопка добавлена');
}
function moveCheck(id) {
  const i = DB.checks.findIndex((x) => x.id === id);
  if (i <= 0) return;
  const a = DB.checks[i - 1];
  DB.checks[i - 1] = DB.checks[i];
  DB.checks[i] = a;
  save();
  pick();
  render();
}
function confirmDelCheck(id) {
  const c = DB.checks.find((x) => x.id === id);
  if (!c) return;
  showModal({
    title: 'Удалить кнопку?',
    text: `«${c.title}» исчезнет с главной. История отметок по ней тоже пропадёт.`,
    ok: 'Удалить',
    danger: true,
    onOk: () => {
      DB.checks = DB.checks.filter((x) => x.id !== id);
      Object.keys(DB.log).forEach((k) => { delete DB.log[k][id]; });
      Object.keys(DB.proofs).forEach((k) => { delete DB.proofs[k][id]; });
      save();
      closeModal();
      render();
      showToast('Кнопка удалена');
    },
  });
}
function confirmWipe() {
  showModal({
    title: 'Стереть все данные?',
    text: 'Задачи, траты, заметки, история отметок и фото исчезнут. Вернуть это будет нельзя.',
    ok: 'Стереть',
    danger: true,
    onOk: () => {
      try { localStorage.removeItem(KEY); } catch (e) {}
      DB = DEFAULTS();
      subs = [];
      tab = 0;
      sheet = null;
      modal = null;
      save();
      render();
      showToast('Всё стёрто');
    },
  });
}

/* ---------- фото ---------- */
async function readPhoto(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const max = 720;
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * sc);
  cv.height = Math.round(img.height * sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return cv.toDataURL('image/jpeg', 0.72);
}
function pickProof(id) {
  proofFor = id;
  const inp = $('#proofInput');
  inp.value = '';
  inp.click();
}
function delProof() {
  if (!sheet) return;
  const id = sheet.id;
  const k = sheet.k || dayKey();
  const store = DB.proofs[k] || {};
  if (!store[id]) { closeSheet(); return; }
  delete store[id];
  if (!Object.keys(store).length) delete DB.proofs[k];
  save();
  const keep = sheet.type === 'ck';
  sheet = keep ? { type: 'ck', id } : null;
  paintCheck(id);
  render();
  showToast('Фото удалено');
}

/* ---------- дыхание ---------- */
function startBreath() {
  let i = 0, left = 60;
  const cycles = [['Вдох', 4, 1], ['Задержка', 4, 1], ['Выдох', 6, 0.62]];
  const tick = () => {
    const c = $('#breathCircle'), t = $('#breathTxt'), l = $('#breathLeft');
    if (!c || !t) { breathTimer = null; return; }
    const cy = cycles[i % cycles.length];
    t.textContent = cy[0];
    c.style.transitionDuration = cy[1] * 1000 + 'ms';
    c.style.transform = `scale(${cy[2]})`;
    left -= cy[1];
    if (l) l.textContent = left > 0 ? `осталось ~${left} с` : 'хорошо';
    if (left <= 0) { t.textContent = 'Хорошо'; breathTimer = null; return; }
    i++;
    breathTimer = setTimeout(tick, cy[1] * 1000);
  };
  tick();
}

/* ---------- нажатия ---------- */
document.addEventListener('click', (e) => {
  if (suppress) { suppress = false; return; }

  const el = e.target.closest('[data-act]');
  const ck = e.target.closest('[data-ck]');

  if (!el && ck) { ckTap(ck); return; }
  if (!el) return;
  if (ck && el === ck) { ckTap(ck); return; }

  const a = el.dataset.act;

  if (a === 'go') { goTab(+el.dataset.tab); return; }
  if (a === 'open-sub') { pick(); showSub(el.dataset.sub); return; }
  if (a === 'back') { pick(); subs.pop(); renderSubs(); return; }
  if (a === 'voice') { openVoice(); return; }
  if (a === 'close-sheet') { closeSheet(); return; }
  if (a === 'example') { toConfirm(el.dataset.t); return; }
  if (a === 'sheet-back') { sheet = { type: 'voice', text: sheet.source || '', hint: '' }; renderSheet(); return; }
  if (a === 'kind') { collectSheet(); sheet.draft = asKind(el.dataset.k, sheet.source || ''); pick(); renderSheet(); return; }
  if (a === 'cat') { collectSheet(); sheet.draft.category = el.dataset.c; pick(); renderSheet(); return; }
  if (a === 'ecat') { collectSheet(); sheet.cat = el.dataset.c; pick(); renderSheet(); return; }
  if (a === 'save') { saveDraft(); return; }
  if (a === 'expense-form') { openExpense(); return; }
  if (a === 'expense-save') { saveExpense(); return; }
  if (a === 'quick') { quickAdd(el.dataset.note, +el.dataset.amt); return; }
  if (a === 'exp-del') { delExpense(el.dataset.id); return; }
  if (a === 'period') { period = el.dataset.p; pick(); render(); return; }
  if (a === 'day-step') { stepDay(+el.dataset.d); return; }
  if (a === 'task-filter') { taskFilter = el.dataset.f; pick(); render(); return; }
  if (a === 'task-toggle') { toggleTask(el.dataset.id); return; }
  if (a === 'task-del') { delTask(el.dataset.id); return; }
  if (a === 'note-del') { delNote(el.dataset.id); return; }
  if (a === 'hist-day') {
    histSel = el.dataset.k;
    pick();
    refreshHistory();
    return;
  }
  if (a === 'today') { openSheet({ type: 'today' }); return; }
  if (a === 'breath') { openSheet({ type: 'breath' }); return; }
  if (a === 'proof') { pickProof(el.dataset.id); return; }
  if (a === 'proof-view') { openSheet({ type: 'proof', id: el.dataset.id, k: el.dataset.k }); return; }
  if (a === 'proof-del') { delProof(); return; }
  if (a === 'pick-icon') { pickedIcon = el.dataset.k; pick(); renderSubs(); return; }
  if (a === 'add-check') { addCheck(); return; }
  if (a === 'check-del') { confirmDelCheck(el.dataset.id); return; }
  if (a === 'check-up') { moveCheck(el.dataset.id); return; }
  if (a === 'remind-toggle') { DB.remind.on = !DB.remind.on; save(); tap(); renderSubs(); return; }
  if (a === 'wipe') { confirmWipe(); return; }
  if (a === 'undo') { const u = toast && toast.undo; toast = null; renderToast(); if (u) u(); return; }
  if (a === 'modal-yes') { const m = modal; closeModal(); if (m && m.onOk) m.onOk(); return; }
  if (a === 'modal-no') { closeModal(); return; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'newCheck') newCheckTitle = e.target.value;
});

document.addEventListener('change', (e) => {
  const t = e.target;
  const a = t.dataset && t.dataset.act;
  if (a === 'budget') {
    const p = t.dataset.p;
    const v = Math.max(0, Math.round((parseFloat(String(t.value).replace(',', '.')) || 0) * 100));
    DB.budgets[p] = v;
    save();
    ok();
    render();
    return;
  }
  if (a === 'remind-at') { DB.remind.at = t.value || '22:00'; save(); return; }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'parseForm') {
    e.preventDefault();
    toConfirm($('#sheetInput') ? $('#sheetInput').value : '');
    return;
  }
  if (e.target.id === 'noteForm') {
    e.preventDefault();
    const inp = $('#noteInput');
    const v = inp ? inp.value.trim() : '';
    if (!v) return;
    DB.notes.unshift({ id: uid(), text: v, createdAt: new Date().toISOString() });
    save();
    ok();
    render();
    showToast('Заметка сохранена');
  }
});

$('#proofInput').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f || !proofFor) return;
  const id = proofFor;
  proofFor = null;
  try {
    const data = await readPhoto(f);
    const k = dayKey();
    DB.proofs[k] = DB.proofs[k] || {};
    DB.proofs[k][id] = data;
    if (!save()) { delete DB.proofs[k][id]; return; }
    ok();
    closeSheet();
    render();
    showToast('Фото добавлено');
  } catch (err) {
    showToast('Не получилось прочитать фото');
  }
});

document.addEventListener('touchstart', (e) => { pressStart(e); swipeStart(e); }, { passive: true });
document.addEventListener('touchmove', (e) => { swipeMove(e); }, { passive: true });
document.addEventListener('touchend', () => { pressEnd(); swipeEnd(); }, { passive: true });
document.addEventListener('touchcancel', () => { pressEnd(); swipeEnd(); }, { passive: true });

let mDown = false;
document.addEventListener('mousedown', (e) => { mDown = true; pressStart(e); swipeStart(e); });
document.addEventListener('mousemove', (e) => { if (mDown) swipeMove(e); });
document.addEventListener('mouseup', () => { mDown = false; pressEnd(); swipeEnd(); });

/* ---------- запуск ---------- */
try {
  if (tgw) {
    tgw.ready();
    tgw.expand();
    try { tgw.setHeaderColor('#0c1310'); tgw.setBackgroundColor('#0c1310'); } catch (e) {}
  }
} catch (e) {}

render();

window.addEventListener('resize', () => { setTrack(tab, true); });
window.addEventListener('orientationchange', () => setTimeout(() => setTrack(tab, true), 200));
/* ===== конец части 5 ===== */
</script>
</body>
